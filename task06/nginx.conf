# Основной блок HTTP конфигурации nginx
http {
   # Настройка upstream для балансировки нагрузки
   # Определяет группу серверов для распределения запросов
   upstream backend_servers {
       # Первый сервер в пуле балансировки
       server backend1.example.com;
       # Второй сервер в пуле балансировки
       server backend2.example.com;
       # Третий сервер в пуле балансировки
       server backend3.example.com;
   }

   # Создание зоны для ограничения частоты запросов по IP-адресу
   # $binary_remote_addr - бинарное представление IP клиента
   # zone=req_limit_per_ip:10m - имя зоны и размер памяти (10 МБ)
   # rate=10r/m - максимум 10 запросов в минуту с одного IP
   limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=10r/m;

   # Блок конфигурации виртуального сервера
   server {
       # Прослушивание порта 80 (HTTP)
       listen 80;

       # Обработка всех запросов к корню сайта
       location / {
           # Применение ограничения частоты запросов
           # zone=req_limit_per_ip - использование созданной зоны
           # burst=0 - не разрешать превышение лимита
           # nodelay - немедленно отклонять превышающие лимит запросы
           limit_req zone=req_limit_per_ip burst=0 nodelay;
           # HTTP статус код 429 для превышения лимита запросов
           limit_req_status 429;
           # Проксирование запросов к группе backend серверов
           proxy_pass http://backend_servers;
       }
   }
}