# API сервиса управления клиентскими данными
# Версия: 1.0.0
# Базовый путь: /v1

# Тип Client - основная сущность клиента
# Соответствует определению Client в Swagger definitions
type Client {
  # Уникальный идентификатор клиента (обязательное поле)
  id: String!
  # Имя клиента (опциональное поле)
  name: String
  # Возраст клиента в годах (опциональное поле)
  age: Int
  # Список документов клиента (обязательный массив, может быть пустым)
  # Соответствует эндпоинту GET /clients/{id}/documents
  documents: [Document!]!
  # Список родственников клиента (обязательный массив, может быть пустым)
  # Соответствует эндпоинту GET /clients/{id}/relatives
  relatives: [Relative!]!
}

# Тип Document - документ клиента
# Соответствует определению Document в Swagger definitions
type Document {
  # Уникальный идентификатор документа (обязательное поле)
  id: String!
  # Тип документа (паспорт, водительские права и т.д.)
  type: String
  # Номер документа
  number: String
  # Дата выдачи документа в строковом формате
  issueDate: String
  # Дата истечения срока действия документа в строковом формате
  expiryDate: String
}

# Тип Relative - родственник клиента
# Соответствует определению Relative в Swagger definitions
type Relative {
  # Уникальный идентификатор родственника (обязательное поле)
  id: String!
  # Тип родственной связи (отец, мать, сын, дочь и т.д.)
  relationType: String
  # Имя родственника
  name: String
  # Возраст родственника в годах
  age: Int
}

# Корневой тип Query - определяет доступные запросы
type Query {
  # Получить информацию о клиенте по ID
  # Соответствует эндпоинту GET /clients/{id}
  # Параметр id - обязательный идентификатор клиента
  # Возвращает объект Client или null если клиент не найден
  client(id: String!): Client
  
  # Список документов клиента
  # Соответствует эндпоинту GET /clients/{id}/documents
  # Параметр id - обязательный идентификатор клиента
  # Возвращает массив документов (может быть пустым)
  clientDocuments(id: String!): [Document!]!
  
  # Информация о родственниках клиента
  # Соответствует эндпоинту GET /clients/{id}/relatives
  # Параметр id - обязательный идентификатор клиента
  # Возвращает массив родственников (может быть пустым)
  clientRelatives(id: String!): [Relative!]!
}